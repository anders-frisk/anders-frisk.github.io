    const init_compass = async () => {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {

            const permission =
                await DeviceOrientationEvent.requestPermission();

            if (permission === "granted") {

                window.addEventListener(
                    "deviceorientation",
                    handle_compass,
                    true
                );

            } else {

                alert(
                    "Compass permission was denied."
                );

            }

        } else {

            // Android / browsers that don't require
            // explicit permission

            window.addEventListener(
                "deviceorientation",
                handle_compass,
                true
            );
        }
    };

        document.querySelector("#debug-heading").textContent = "head: " + heading;
        document.querySelector("#debug-speed").textContent = "speed: " + (speed ? (speed * 3.6).toFixed(1) + "km/h" : "-");
    };
