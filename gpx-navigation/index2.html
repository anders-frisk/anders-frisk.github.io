<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>GPS Map</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #wrapper {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        body.nav-mode #map {
            top: -25%;
            left: -25%;
            width: 150%;
            height: 150%;
        }

        .direction-marker {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 24px solid #1976d2;
            transform-origin: 50% 66.666%;
        }

        #start-compass
        {
            position: absolute;
            top: 100px;
            left: 0px;
            width: 100%;
        }

        #map-mode {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: 4rem;
            height: 4rem;
            font-size: 1rem;
            padding: 0;
        }

        #zoom-out {
            position: absolute;
            right: 1rem;
            bottom: 6rem;
            width: 4rem;
            height: 4rem;
            font-size: 1.5rem;
            display: none;
            padding: 0;
        }

        #zoom-in {
            position: absolute;
            right: 1rem;
            bottom: 11rem;
            width: 4rem;
            height: 4rem;
            font-size: 1.5rem;
            display: none;
            padding: 0;
        }

        body.nav-mode #zoom-out,
        body.nav-mode #zoom-in {
            display: block;
        }

        #debug {
            position: absolute;
            bottom: 0px;
            left: 0px;
            right: 0px;
            background-color: rgba(255, 255, 255, 0.8);
        }
    </style>

    <!-- <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> -->
         <!-- <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" /> -->

    <script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet.js"></script>
    <link href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" rel="stylesheet" />

    <script src="halmstad_epic.js"></script>

<script>

    const qs = (selector) => document.querySelector(selector);

    let map = null;

    let positionMarker = null;
    let firstPosition = true;
    let accuracyCircle = null;
    let directionIcon = null;

    let latitude = null;
    let longitude = null;
    let accuracy = null;
    let heading = null;
    let speed = null;
    let absolute_alpha = null;
    let webkit_compass_heading = null;

    const init_map = () => {
        // Create map
        map = L.map("map", {
            zoomControl: false
            });
            
            // OpenStreetMap tiles
            // L.tileLayer(
                //     "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                //     {
                    //         maxZoom: 19,
                    //         attribution: "&copy; OpenStreetMap contributors"
                    //     }
                    // ).addTo(map);
                    
            L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', { attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
            
            
            L.polyline(halmstad_epic).addTo(map);
            //map.fitBounds(L.polyline(coordinates).getBounds());
            
            
            // Create direction marker
            directionIcon = L.divIcon({
                className: "",
                html: '<div class="direction-marker"></div>',
                iconSize: [16, 24],
                iconAnchor: [8, 16]
                });

//map.getLatLng().latitude ?? 

        map.setView(
            [0, 0],
            map.getZoom() || 17
        );
    };

    const init_gps = () => {
        navigator.geolocation.watchPosition(
            handle_gps,
            function(error) { console.error("GPS error:", error.message); },
            {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 10000
            }
        );
    };

    const init_compass = async () => {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {

            const permission = await DeviceOrientationEvent.requestPermission();

            if (permission === "granted") {
                window.addEventListener(
                    "deviceorientation",
                    handle_compass,
                    true
                );
            } else {
                alert("Compass permission was denied.");
            }

        } else {

            // Android / browsers that don't require
            // explicit permission

            window.addEventListener(
                "deviceorientation",
                handle_compass,
                true
            );
        }
    };





    const handle_gps = (position) => {
        latitude = position.coords.latitude;
        longitude = position.coords.longitude;
        accuracy = position.coords.accuracy; // meters
        speed = position.coords.speed; // m/s
        heading = position.coords.heading; // degrees

        request_refresh();

        qs("#debug-latitude").textContent = "lat: " + (latitude ? latitude.toFixed(6) : "-");
        qs("#debug-longitude").textContent = "lon: " + (longitude ? longitude.toFixed(6) : "-");
        qs("#debug-accuracy").textContent = "acc: " + (accuracy ? accuracy.toFixed(1) + "m" : "-");
        qs("#debug-heading").textContent = "head: " + (heading ? heading.toFixed(1) + "°" : "-");
        qs("#debug-speed").textContent = "speed: " + (speed ? (speed * 3.6).toFixed(1) + "km/h" : "-");
    };





    let lastCompassUpdate = 0;
    const compassInterval = 10; // 100 ms = 10 Hz, 20 ms = 50 Hz, 10 ms = 100 Hz

    const handle_compass = (event) => {

        const now = performance.now();

        if (now - lastCompassUpdate > compassInterval)
        {
            lastCompassUpdate = now;
            
            absolute_alpha = event.absolute ? event.alpha : null; //alpha = event.alpha; // degrees (only absolute values are reliable, absolute = true >> device is providing a true compass heading)
            webkit_compass_heading = event.webkitCompassHeading; // degrees
            
            request_refresh();

            qs("#debug-absolute-alpha").textContent = "absoluteAlpha: " + (absolute_alpha ? absolute_alpha.toFixed(1) + "°" : "-");
            qs("#debug-webkit-compass-heading").textContent = "webkitCompassHeading: " + (webkit_compass_heading ? webkit_compass_heading.toFixed(1) + "°" : "-");
        }
    };





    let request_refresh_pending = false;

    const request_refresh = () => {
        if (request_refresh_pending !== true)
        {
            request_refresh_pending = true;
            
            window.queueMicrotask(() => {
                request_refresh_pending = false;
                update_map();
            });
        }
    };


    const update_map = () => {


        if (map === null) console.log("map is null");


        if (latitude !== null && longitude !== null) {
            // Create marker the first time
            if (!positionMarker) {

                positionMarker = L.marker(
                    [latitude, longitude],
                    {
                        icon: directionIcon
                    }
                ).addTo(map);

            } else {

                positionMarker.setLatLng([
                    latitude,
                    longitude
                ]);

            }
        }

        if (latitude !== null && longitude !== null) {
            if (!accuracyCircle)
            {
                accuracyCircle = L.circle(
                    [latitude, longitude],
                    {
                        radius: accuracy,
                        // Appearance
                        color: "#1976d2",
                        weight: 2,
                        fillColor: "#1976d2",
                        fillOpacity: 0.15
                    }
                ).addTo(map);
            } else {
                accuracyCircle.setLatLng([latitude, longitude]);
                accuracyCircle.setRadius(accuracy);
            }
        }

        // Center map on user
        if (mode === MAP_MODE.NAV) {
            if (latitude !== null && longitude !== null) {
                map.setView(
                    [latitude, longitude],
                    map.getZoom() || 17
                );
            }
        }



        // Get direction for the arrow. Compass takes precedence over heading
        const direction = 
            webkit_compass_heading !== null && !isNaN(webkit_compass_heading)
                ? webkit_compass_heading
                : absolute_alpha !== null && !isNaN(absolute_alpha)
                    ? (180 - absolute_alpha + 360) % 360
                    : heading !== null && !isNaN(heading)
                        ? heading
                        : 0;

        // Rotate arrow
        const arrow = positionMarker?.getElement()?.querySelector(".direction-marker");
        if (arrow) {
            arrow.style.transform =
            `rotate(${direction}deg)`;
        }
        
        
        // Rotate map
        if (mode === MAP_MODE.NAV) {
            const mapElement = qs("#map");
            if (mapElement) {
                mapElement.style.transform = `rotate(${-direction}deg)`;
            }
        }
        else
        {
            const mapElement = qs("#map");
            if (mapElement) {
                mapElement.style.transform = `rotate(0deg)`;
            }
        }

    };





    const MAP_MODE = {
        MAP: "map",
        NAV: "nav"
    };

    let mode = null;

    const toggle_map_mode = () => 
        mode === MAP_MODE.MAP ? set_map_mode(MAP_MODE.NAV) : set_map_mode(MAP_MODE.MAP);

    const set_map_mode = (newMode) => {
        mode = newMode;
        qs("#map-mode").textContent = mode === MAP_MODE.MAP ? "NAV" : "MAP";
        if (mode === MAP_MODE.NAV) {
            document.body.classList.add("nav-mode");
            map.invalidateSize();

            map.dragging.disable();
            map.touchZoom.disable();
            map.scrollWheelZoom.disable();
            map.doubleClickZoom.disable();
            map.boxZoom.disable();
            map.keyboard.disable();
        } else {
            document.body.classList.remove("nav-mode");
            map.invalidateSize();

            map.dragging.enable();
            map.touchZoom.enable();
            map.scrollWheelZoom.enable();
            map.doubleClickZoom.enable();
            map.boxZoom.enable();
            map.keyboard.enable();
        }
        request_refresh();
    };


    const init = () => {
        init_map();
        init_gps();
        //init_compass(); // Must be started manually by the user due to permission requirements
        set_map_mode(MAP_MODE.MAP); // Set initial map mode to MAP
    };

</script>

</head>

<body onload="init()">
    <div id="wrapper">
        <div id="map"></div>
        <div id="debug">
            <div id="debug-latitude"></div>
            <div id="debug-longitude"></div>
            <div id="debug-accuracy"></div>
            <div id="debug-heading"></div>
            <div id="debug-speed"></div>
            <div id="debug-absolute-alpha"></div>
            <div id="debug-webkit-compass-heading"></div>
        </div>
        <button id="start-compass" onclick="init_compass()">
            Start Compass
        </button>
        <button id="zoom-in" onclick="map.zoomIn()">+</button>
        <button id="zoom-out" onclick="map.zoomOut()">−</button>
        <button id="map-mode" onclick="toggle_map_mode()">-</button>
    </div>
</body>
</html>
