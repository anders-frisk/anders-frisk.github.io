<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>GPS Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .direction-marker {
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 30px solid #1976d2;
            transform-origin: 50% 70%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="halmstad_epic.js"></script>

<script>

    // Create map
    const map = L.map("map", {
        zoomControl: false
    });

    // OpenStreetMap tiles
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    L.polyline(halmstad_epic).addTo(map);
    //map.fitBounds(L.polyline(coordinates).getBounds());


    // Create direction marker
    const directionIcon = L.divIcon({
        className: "",
        html: '<div class="direction-marker"></div>',
        iconSize: [24, 30],
        iconAnchor: [12, 15]
    });

    let positionMarker = null;
    let firstPosition = true;


    // Watch GPS position
    navigator.geolocation.watchPosition(

        function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            // GPS heading, in degrees
            const heading = position.coords.heading;

            console.log({
                latitude,
                longitude,
                accuracy,
                heading
            });


            // Create marker the first time
            if (!positionMarker) {

                positionMarker = L.marker(
                    [latitude, longitude],
                    {
                        icon: directionIcon
                    }
                ).addTo(map);

            } else {

                positionMarker.setLatLng([
                    latitude,
                    longitude
                ]);

            }


            // Center map on user
            map.setView(
                [latitude, longitude],
                map.getZoom() || 17
            );


            // Rotate direction arrow
            if (heading !== null && !isNaN(heading)) {

                const element =
                    positionMarker.getElement();

                if (element) {

                    const arrow =
                        element.querySelector(
                            ".direction-marker"
                        );

                    if (arrow) {
                        arrow.style.transform =
                            `rotate(${heading}deg)`;
                    }
                }
            }

        },

        function(error) {

            console.error(
                "GPS error:",
                error.message
            );

            alert(
                "Unable to get your position: " +
                error.message
            );

        },

        {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 10000
        }

    );

</script>

</body>
</html>
