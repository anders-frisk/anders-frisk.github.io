<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover"
    >

    <title>GPS Navigation</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /*
         * The Leaflet map will be rotated.
         * The marker itself will NOT rotate.
         */
        .map-rotated {
            transform-origin: center center;
        }

        /*
         * User position arrow.
         * Always points UP.
         */
        .direction-marker {
            width: 0;
            height: 0;

            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 32px solid #1976d2;

            filter:
                drop-shadow(0 1px 2px rgba(0,0,0,0.4));
        }

    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    /*
     * Create map
     */
    const map = L.map("map", {
        zoomControl: false,
        attributionControl: true
    });


    /*
     * OpenStreetMap
     */
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    /*
     * User arrow.
     *
     * Notice that this arrow is NOT rotated.
     * It always points toward the top of the screen.
     */
    const directionIcon = L.divIcon({
        className: "",
        html: '<div class="direction-marker"></div>',
        iconSize: [24, 32],
        iconAnchor: [12, 16]
    });


    let positionMarker = null;

    let currentHeading = 0;


    /*
     * Rotate the map.
     */
    function rotateMap(heading) {

        const mapElement = document.getElementById("map");

        /*
         * If the phone heading is 90 degrees,
         * east is pointing up.
         *
         * Therefore we rotate the MAP by -90 degrees.
         */
        const rotation = -heading;

        mapElement.style.transform =
            `rotate(${rotation}deg)`;

    }


    /*
     * GPS
     */
    navigator.geolocation.watchPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;

            const heading =
                position.coords.heading;


            console.log({
                latitude,
                longitude,
                accuracy,
                heading
            });


            /*
             * Create marker
             */
            if (!positionMarker) {

                positionMarker = L.marker(
                    [latitude, longitude],
                    {
                        icon: directionIcon
                    }
                ).addTo(map);

            }

            /*
             * Update marker position
             */
            else {

                positionMarker.setLatLng([
                    latitude,
                    longitude
                ]);

            }


            /*
             * Keep map centered on user
             */
            map.setView(
                [latitude, longitude],
                map.getZoom() || 17,
                {
                    animate: false
                }
            );


            /*
             * GPS heading
             */
            if (
                heading !== null &&
                !isNaN(heading)
            ) {

                currentHeading = heading;

                rotateMap(currentHeading);

            }

        },

        function(error) {

            console.error(
                "GPS error:",
                error.message
            );

            alert(
                "Unable to get your position: " +
                error.message
            );

        },

        {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 10000
        }

    );

</script>

</body>
</html>
